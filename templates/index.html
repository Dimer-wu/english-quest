<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>English Quest · 英语闯关</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <link rel="manifest" href="/manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900&family=IBM+Plex+Sans:wght@400&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'IBM Plex Sans', sans-serif;
            background: #FFFDF0;
            color: #000;
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
        }
        h1, h2, h3, .font-display {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
        }
        .card {
            background: #FFFDF0;
            border: 3px solid #000;
            box-shadow: 8px 8px 0px #000;
            border-radius: 0;
        }
        .btn-primary {
            background: #FF6B00;
            color: #000;
            border: 3px solid #000;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            padding: 12px 24px;
            cursor: pointer;
            transition: transform 0.15s;
            border-radius: 0;
            box-shadow: 4px 4px 0px #000;
        }
        .btn-primary:hover { transform: translateY(-2px); }
        .btn-primary:active { transform: translateY(0); box-shadow: 1px 1px 0px #000; }
        .input-field {
            border: 3px solid #000;
            padding: 12px 16px;
            font-family: 'IBM Plex Sans', sans-serif;
            font-size: 16px;
            background: #FFFDF0;
            border-radius: 0;
            width: 100%;
        }
        .input-field:focus {
            outline: none;
            border-color: #FF6B00;
        }
        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            background: #FFFDF0;
            border-top: 3px solid #000;
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            z-index: 100;
        }
        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            font-weight: 700;
            color: #999;
            cursor: pointer;
            padding: 4px 12px;
            transition: color 0.15s;
        }
        .tab-item.active { color: #000; }
        .tab-item i { font-size: 20px; margin-bottom: 2px; }
        .page { display: none; padding: 20px 16px 120px; }
        .page.active { display: block; animation: bounceIn 0.4s ease; }
        @keyframes bounceIn {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <!-- 页面容器 -->
    <div id="loginPage" class="page active"></div>
    <div id="homePage" class="page"></div>
    <div id="studyPage" class="page"></div>
    <div id="chunksPage" class="page"></div>
    <div id="profilePage" class="page"></div>

    <!-- Tab 导航栏 -->
    <nav class="tab-bar" id="tabBar" style="display:none">
        <div class="tab-item active" data-page="homePage">
            <i class="fa fa-graduation-cap"></i> 学习
        </div>
        <div class="tab-item" data-page="chunksPage">
            <i class="fa fa-book"></i> 语块本
        </div>
        <div class="tab-item" data-page="profilePage">
            <i class="fa fa-user"></i> 我的
        </div>
    </nav>

    <script src="/static/app.js"></script>
</body>
</html>
